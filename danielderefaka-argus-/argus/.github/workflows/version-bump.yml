name: Version Bump

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "$NEW" > VERSION
          echo "Version bump: ${CURRENT} -> ${NEW}"

      - name: Sync plugin.json version
        run: |
          NEW=$(cat VERSION | tr -d '[:space:]')
          # Update .claude-plugin/plugin.json's version field
          python3 - <<PY
          import json, pathlib
          p = pathlib.Path('.claude-plugin/plugin.json')
          d = json.loads(p.read_text())
          d['version'] = '$NEW'
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION .claude-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git commit -m "bump: $(cat VERSION)"
          git push
